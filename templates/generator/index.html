<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Quilt Generator — Pick a Style</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      font-size: 15px;
      background: #f5f4f1;
      color: #2c2c2c;
      min-height: 100vh;
    }

    header {
      padding: 40px 40px 24px;
      max-width: 1100px;
      margin: 0 auto;
    }
    header h1 {
      font-size: 28px;
      font-weight: 700;
      color: #1a1a1a;
      margin-bottom: 6px;
    }
    header p {
      font-size: 15px;
      color: #777;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px;
      padding: 0 40px 60px;
      max-width: 1100px;
      margin: 0 auto;
    }

    .card {
      background: #fff;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      transition: box-shadow 0.15s, transform 0.15s;
    }
    .card:hover {
      box-shadow: 0 6px 20px rgba(0,0,0,0.13);
      transform: translateY(-2px);
    }

    .card img {
      width: 100%;
      aspect-ratio: 1 / 1;
      display: block;
      object-fit: cover;
    }

    .card-body {
      padding: 12px 14px 16px;
    }
    .card-name {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 3px;
      color: #1a1a1a;
    }
    .card-desc {
      font-size: 12px;
      color: #888;
      line-height: 1.4;
    }

    .custom-link {
      display: block;
      text-align: center;
      padding: 16px;
      margin: 0 40px 60px;
      max-width: 1100px;
      font-size: 14px;
      color: #6b5ea8;
      text-decoration: none;
    }
    .custom-link:hover { text-decoration: underline; }
  </style>
</head>
<body>

<header>
  <h1>Quilt Generator</h1>
  <p>Pick a style to start, then tweak the parameters to make it yours.</p>
</header>

<div class="grid">
  {% for key, preset in presets.items() %}
  <a class="card" href="/create?preset={{ key }}">
    <img src="/static/generator/families/{{ key }}.png"
         alt="{{ preset.name }}"
         loading="lazy">
    <div class="card-body">
      <div class="card-name">{{ preset.name }}</div>
      <div class="card-desc">{{ preset.description }}</div>
    </div>
  </a>
  {% endfor %}
</div>

<a class="custom-link" href="/create">Start from scratch →</a>

</body>
</html>
