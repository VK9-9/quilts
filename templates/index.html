<!DOCTYPE html>
<html>
<head>
<title>Quilt Explorer</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, sans-serif;
    background: #1a1a1a;
    color: #e0e0e0;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 20px;
  }
  h1 { font-size: 1.4em; margin-bottom: 10px; color: #aaa; }
  .stats {
    font-size: 0.85em;
    color: #888;
    margin-bottom: 15px;
  }
  .stats .model-active { color: #6c6; }
  .quilt-container {
    position: relative;
    margin-bottom: 20px;
  }
  .quilt-container img {
    max-width: 700px;
    max-height: 700px;
    border: 2px solid #333;
    display: block;
  }
  .quilt-container.loading img { opacity: 0.3; }
  .quilt-container .spinner {
    display: none;
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    font-size: 2em; color: #aaa;
  }
  .quilt-container.loading .spinner { display: block; }
  .buttons {
    display: flex;
    gap: 20px;
    margin-bottom: 20px;
  }
  button {
    font-size: 1.3em;
    padding: 12px 40px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.1s;
  }
  button:active { transform: scale(0.95); }
  .btn-like { background: #2d7d2d; color: white; }
  .btn-like:hover { background: #3a9a3a; }
  .btn-dislike { background: #7d2d2d; color: white; }
  .btn-dislike:hover { background: #9a3a3a; }
  .btn-skip { background: #444; color: #ccc; }
  .btn-skip:hover { background: #555; }
  .params {
    font-size: 0.8em;
    color: #666;
    max-width: 700px;
    word-break: break-all;
    text-align: center;
    margin-bottom: 15px;
  }
  .importance {
    font-size: 0.8em;
    color: #777;
    max-width: 500px;
    margin-top: 10px;
  }
  .importance h3 { color: #999; margin-bottom: 5px; }
  .importance .bar-row {
    display: flex;
    align-items: center;
    margin: 2px 0;
  }
  .importance .bar-label {
    width: 140px;
    text-align: right;
    padding-right: 8px;
  }
  .importance .bar {
    height: 12px;
    background: #4a7a4a;
    border-radius: 2px;
  }
  .shortcut { font-size: 0.75em; color: #555; }
</style>
</head>
<body>
  <h1>Quilt Explorer</h1>
  <div class="stats" id="stats"></div>

  <div class="quilt-container" id="container">
    <img id="quilt-img" src="" alt="quilt">
    <div class="spinner">loading...</div>
  </div>

  <div class="buttons">
    <button class="btn-dislike" onclick="rate(false)">Dislike (N)</button>
    <button class="btn-skip" onclick="skip()">Skip (S)</button>
    <button class="btn-like" onclick="rate(true)">Like (Y)</button>
  </div>

  <div class="shortcut">Y / N / S &nbsp; or &nbsp; ← / →</div>
  <div class="params" id="params"></div>
  <div class="importance" id="importance"></div>

<script>
let currentParams = null;
let loading = false;

async function loadNext() {
  if (loading) return;
  loading = true;
  document.getElementById('container').classList.add('loading');

  const resp = await fetch('/next');
  const data = await resp.json();
  currentParams = data.params;

  const img = document.getElementById('quilt-img');
  img.src = '/render?' + new URLSearchParams(
    {params: JSON.stringify(currentParams)}
  );
  img.onload = () => {
    document.getElementById('container').classList.remove('loading');
    loading = false;
  };

  document.getElementById('params').textContent =
    Object.entries(currentParams)
      .filter(([k]) => k !== 'seed')
      .map(([k, v]) => `${k}=${v}`)
      .join('  ');

  updateStats(data.stats);
  updateImportance(data.importance);
}

async function rate(liked) {
  if (!currentParams || loading) return;
  await fetch('/rate', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({params: currentParams, liked: liked}),
  });
  loadNext();
}

function skip() { if (!loading) loadNext(); }

function updateStats(stats) {
  if (!stats) return;
  let html = `Rated: ${stats.total} (${stats.liked} liked, ${stats.disliked} disliked)`;
  if (stats.model_active) {
    html += ' &mdash; <span class="model-active">model active</span>';
  }
  document.getElementById('stats').innerHTML = html;
}

function updateImportance(imp) {
  const el = document.getElementById('importance');
  if (!imp || imp.length === 0) { el.innerHTML = ''; return; }
  const maxVal = imp[0][1];
  let html = '<h3>Feature importance</h3>';
  for (const [name, val] of imp.slice(0, 8)) {
    const w = Math.round((val / maxVal) * 200);
    html += `<div class="bar-row">
      <span class="bar-label">${name}</span>
      <div class="bar" style="width:${w}px"></div>
    </div>`;
  }
  el.innerHTML = html;
}

document.addEventListener('keydown', (e) => {
  if (e.key === 'y' || e.key === 'ArrowRight') rate(true);
  else if (e.key === 'n' || e.key === 'ArrowLeft') rate(false);
  else if (e.key === 's') skip();
});

loadNext();
</script>
</body>
</html>
