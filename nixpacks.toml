[phases.setup]
aptPkgs = ["libcairo2-dev", "pkg-config", "libgirepository1.0-dev", "python3-dev", "libxcb1-dev"]

# Override install to use slim requirements (no pytorch/sklearn)
[phases.install]
cmds = ["python -m venv --copies /opt/venv && . /opt/venv/bin/activate && pip install -r requirements-railway.txt"]
paths = ["/opt/venv/bin"]

# Nix gcc needs /usr/include to find apt-installed headers (xcb/xcb.h)
[variables]
CPATH = "/usr/include"
